[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cptdm"
version = "0.4.9"
description = "CPT Data Manager – download and convert climate datasets to CPT-compatible files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary – Alisios Corporation" }
authors = [{ name = "Ángel G. Muñoz", email = "angel.g.munoz@alisioscorporation.com" }]

dependencies = [
    "cdsapi>=0.7",
    "xarray>=2022.6",
    "numpy>=1.22",
    "pandas>=1.4",
    "netCDF4>=1.6",
    "cfgrib>=0.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "aiohttp>=3.8",
    "rich>=12",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
]

[project.scripts]
cptdm = "cptdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cptdm = ["data/datasets.yml"]
