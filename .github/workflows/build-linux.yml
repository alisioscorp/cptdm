name: Build Linux x86_64 Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y gcc g++ patchelf ccache
      - name: Python deps
        run: pip install --upgrade pip && pip install cdsapi xarray numpy pandas netCDF4 cfgrib pydantic pyyaml requests aiohttp rich click zstandard pycryptodomex ordered-set Jinja2 appdirs tqdm
      - name: Nuitka Commercial
        env:
          GH_TOKEN: ${{ secrets.NUITKA_REPO_TOKEN }}
        run: |
          gh release download v4.0.5 --repo alisioscorp/nuitka-private --pattern "Nuitka-commercial-main.zip" --dir /tmp
          pip install /tmp/Nuitka-commercial-main.zip --force-reinstall
          python -c "import nuitka.plugins.commercial; print('OK')"
      - name: Install cptdm
        run: pip install . && python -c "from cptdm import __version__; print(__version__)"
      - name: Get version
        id: ver
        run: echo "version=$(python -c 'from cptdm import __version__; print(__version__)')" >> $GITHUB_OUTPUT
      - name: Build
        run: |
          python -m nuitka --standalone --onefile --output-dir=dist --output-filename=cptdm \
            --enable-plugin=data-hiding \
            --python-flag=no_site --python-flag=isolated --python-flag=no_docstrings \
            --static-libpython=no \
            --include-package=cptdm --include-package=cdsapi \
            --include-package=xarray --include-package=numpy --include-package=pandas \
            --include-package=netCDF4 --include-package=cfgrib --include-package=eccodes --include-package=cftime \
            --include-package=pydantic --include-package=pydantic_core \
            --include-package=yaml --include-package=requests --include-package=urllib3 \
            --include-package=certifi --include-package=charset_normalizer \
            --include-package=aiohttp --include-package=aiosignal \
            --include-package=frozenlist --include-package=multidict --include-package=yarl \
            --include-package=rich --include-package=click --include-package=zstandard \
            --include-data-files="config/datasets.yml=cptdm/data/datasets.yml" \
            --enable-plugin=anti-bloat \
            --noinclude-pytest-mode=nofollow --noinclude-setuptools-mode=nofollow \
            --company-name="Alisios Corporation" --product-name="CPT-DM" \
            --product-version="${{ steps.ver.outputs.version }}" \
            --file-description="Climate Predictability Tool Data Acquisition Module" \
            --copyright="Copyright 2025 Alisios Corporation. All rights reserved." \
            --warn-implicit-exceptions \
            --jobs=1 \
            src/cptdm
      - name: Smoke test
        run: |
          chmod +x dist/cptdm && dist/cptdm --version
          dist/cptdm --timescale seasonal --dataset cds_ecmwf_seasonal --obs-dataset chirps3 --variable prcp --init 2026-03 --lead 1-3 --bbox -10,30,15,55 --dry-run
      - name: Package
        run: |
          sha256sum dist/cptdm > dist/cptdm.linux.sha256
          cp dist/cptdm dist/cptdm-linux-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cptdm-linux-x86_64-${{ steps.ver.outputs.version }}
          path: dist/cptdm-linux-x86_64
          retention-days: 30
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cptdm-linux-x86_64
