# ---------------------------------------------------------------------------
# OBSERVATIONS  –  CHIRPS v3 (precipitation)
# ---------------------------------------------------------------------------

chirps3:
  label: "CHIRPS v3 (CHC)"
  short_label: "CHIRPSv3"
  provider: http
  timescales: [seasonal, intraseasonal]
  file_type: obs
  variables: [prcp, rfreq]
  clim_years: [1991, 2020]   # WMO standard; override with --clim
  http_params:
    monthly_url: "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/monthly/global/netcdf/by_year/"
    daily_url: "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/final/rnl/netcdf/byMonth/"
    file_pattern_monthly: "chirps-v3.0.{YYYY}.monthly.nc"
    file_pattern_daily: "chirps-v3.0.{YYYY}.{MM}.days_p05.nc"
    variables:
      prcp:
        nc_var: "precip"
        units_in: "mm/day"    # daily files; monthly files already in mm/month
        units_out: "mm"
        aggregation: total
        fill_value_threshold: 0   # values < 0 are missing
      rfreq:
        # Rainfall frequency = number of wet days (precip > 1 mm/day) per season.
        # Derived from CHIRPS daily files (chirps-v3.0.YYYY.MM.days_p05.nc),
        # variable "precip", threshold 1.0 mm/day.
        nc_var: "precip"
        units_in: "mm/day"
        units_out: "days"
        aggregation: rfreq
        wet_day_threshold: 1.0    # mm/day; standard CPT threshold
        fill_value_threshold: 0

# ---------------------------------------------------------------------------
# REANALYSIS  –  ERA5-Land (temperature: tmean, tmax, tmin)
# ---------------------------------------------------------------------------

era5land:
  label: "ERA5-Land (CDS)"
  short_label: "era5land"
  provider: cds
  timescales: [seasonal, intraseasonal]
  file_type: reanalysis
  variables: [tmean]
  clim_years: [1991, 2020]
  http_params: {}   # not used; era5land fetched via cdsapi
  cds_params:
    dataset: "reanalysis-era5-land-monthly-means"
    dataset_daily: "reanalysis-era5-land"
    variables:
      tmean:
        cds_name: "2m_temperature"
        nc_var: "t2m"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean

    product_type: "monthly_averaged_reanalysis"

# ---------------------------------------------------------------------------
# OBSERVATIONS  –  CRU v4.09 (precipitation + temperature, monthly/seasonal)
# ---------------------------------------------------------------------------

cru409:
  label: "CRU TS4.09 (University of East Anglia)"
  short_label: "CRUv409"
  provider: http
  timescales: [seasonal]
  file_type: obs
  variables: [prcp, tmean]
  clim_years: [1991, 2020]
  http_params:
    base_url: "https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.09/cruts.2503051245.v4.09/"
    variables:
      prcp:
        filename: "pre/cru_ts4.09.1901.2024.pre.dat.nc.gz"
        nc_var: "pre"
        units_in: "mm/month"
        units_out: "mm"
        aggregation: total
      tmean:
        filename: "tmp/cru_ts4.09.1901.2024.tmp.dat.nc.gz"
        nc_var: "tmp"
        units_in: "degree_Celsius"
        units_out: "degree_Celsius"
        aggregation: mean
      rfreq:
        # Rainfall frequency = number of wet days per month/season.
        # CRU TS4.09 'wet' variable: mean number of wet-days per month
        # (days with precip > 1.0 mm). Seasonal aggregation = sum of monthly means.
        filename: "wet/cru_ts4.09.1901.2024.wet.dat.nc.gz"
        nc_var: "wet"
        units_in: "days"
        units_out: "days"
        aggregation: total
      tmax:
        filename: "tmx/cru_ts4.09.1901.2024.tmx.dat.nc.gz"
        nc_var: "tmx"
        units_in: "degree_Celsius"
        units_out: "degree_Celsius"
        aggregation: mean
      tmin:
        filename: "tmn/cru_ts4.09.1901.2024.tmn.dat.nc.gz"
        nc_var: "tmn"
        units_in: "degree_Celsius"
        units_out: "degree_Celsius"
        aggregation: mean

# ---------------------------------------------------------------------------
# SST / INDEX  –  ERSST v5 (seasonal only)
# ---------------------------------------------------------------------------

ersst5:
  label: "NOAA ERSST v5"
  short_label: "ERSSTv5"
  provider: http
  timescales: [seasonal]
  file_type: obs
  variables: [sst]
  clim_years: [1991, 2020]
  http_params:
    base_url: "https://downloads.psl.noaa.gov/Datasets/noaa.ersst.v5/"
    file_pattern: "sst.mnmean.nc"   # single multi-year file
    variables:
      sst:
        nc_var: "sst"
        units_in: "degree_Celsius"
        units_out: "degree_Celsius"
        aggregation: mean
        fill_value: -9.96921e+36

# ---------------------------------------------------------------------------
# INDEX  –  RONI (Relative ENSO Index, NOAA CPC)
# Seasonal only. Downloaded as plain text from NOAA CPC.
# ---------------------------------------------------------------------------

roni:
  label: "RONI – Relative ENSO Index (NOAA CPC)"
  short_label: "roni"
  provider: http
  timescales: [seasonal]
  file_type: index
  variables: [enso_index]
  clim_years: [1991, 2020]   # WMO standard period for filename labelling
  http_params:
    url: "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso/roni/"
    # Actual data file URL TBD; CPC page structure needs verification at runtime
    data_url: "https://www.cpc.ncep.noaa.gov/data/indices/RONI.ascii.txt"
    variables:
      enso_index:
        units_in: "dimensionless"
        units_out: "dimensionless"
        aggregation: mean

# ---------------------------------------------------------------------------
# VALID PAIRING MATRIX  (for validation; auto-derived from valid_pairs above)
# This section makes the rules explicit and human-readable.
# ---------------------------------------------------------------------------
# seasonal:
#   prcp forecasts: cds_ecmwf_seasonal, cds_ncep_seasonal, cds_eccc_seasonal,
#                   nmme_cfsv2, nmme_cansipsv2
#   prcp obs:       chirps3, cru409
#   temp forecasts: cds_ecmwf_seasonal, cds_ncep_seasonal, cds_eccc_seasonal,
#                   nmme_cfsv2 (tmean only), nmme_cansipsv2 (tmean only)
#   temp rean:      era5land, cru409
#   sst:            ersst5 (paired with any seasonal fc)
#   enso:           roni   (paired with any seasonal fc)
#
# intraseasonal:
#   prcp forecasts: s2sdb_ecmwf, s2sdb_ncep, subc_esrl_fimr1p1
#   prcp obs:       chirps3
#   temp forecasts: s2sdb_ecmwf, s2sdb_ncep, subc_esrl_fimr1p1
#   temp rean:      era5land

