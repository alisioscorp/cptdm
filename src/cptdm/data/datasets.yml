# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  SEASONAL FORECASTS — NMME (via NOAA FTP/HTTPS mirror)                 ║
# ║  Note: IRIDL is defunct. NMME data accessed via ftp.cpc.ncep.noaa.gov. ║
# ║  Daily data availability varies by model; RFREQ only where daily avail.║
# ╚═══════════════════════════════════════════════════════════════════════════╝

nmme_cfsv2:
  label: "NMME CFSv2 (NOAA FTP)"
  short_label: "CFSv2"
  provider: http
  timescales: [seasonal]
  file_type: forecast
  variables: [prcp, tmean, rfreq]
  clim_years: [1991, 2020]   # WMO standard; data available from 1982
  available_years: [1982, ":"]
  valid_pairs:
    prcp: [chirps3, cru409]
    rfreq: [chirps3, cru409]
    tmean: [era5land, cru409]
  http_params:
    base_url: "https://ftp.cpc.ncep.noaa.gov/NMME"
    hindcast_path: "/clim/{model}/{variable}/"
    realtime_path: "/realtime_anom/{model}/{variable}/"
    file_pattern_hindcast: "{model}.{variable}.{YYYYMM}.nc"
    file_pattern_forecast: "{model}.{variable}.{YYYYMM}.nc"
    model_id: "CFSv2"
    variables:
      prcp:
        nc_var: "prec"
        units_in: "mm/day"
        units_out: "mm"
        aggregation: total
        has_daily: true      # CFSv2 has daily → RFREQ computable
      tmean:
        nc_var: "tref"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
        has_daily: false

nmme_cansipsv2:
