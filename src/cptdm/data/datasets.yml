# =============================================================================
# CPT-DM Dataset Registry  (datasets.yml)
# Part of: CPT-DM — Climate Predictability Tool, Data Acquisition & Download Module
# Produced by Alisios Corporation (https://alisioscorporation.com)
# Contact: angel.g.munoz@alisioscorporation.com
# =============================================================================
#
# PLACEMENT
# ---------
# Place this file in the SAME DIRECTORY as the cptdm binary (or cptdm.exe on
# Windows).  At startup CPT-DM looks for datasets.yml next to the executable
# first; if not found it falls back to the copy bundled inside the binary.
# Editing this external copy lets you add sources or tweak parameters without
# rebuilding.
#
# SCHEMA RULES  (validated at startup by registry/loader.py)
# ----------------------------------------------------------
#   - Each top-level key is a dataset_id (used in --dataset flag).
#   - provider:    one of [cds, http, opendap, thredds, s2sdb, subc, http_index]
#   - timescales:  list of [seasonal, intraseasonal]
#   - file_type:   one of [forecast, hindcast, obs, reanalysis, index]
#   - variables:   list of variable IDs this dataset provides
#   - clim_years:  default climatology period [start, end]; null = use all years
#   - valid_pairs: datasets that can be paired with this one as obs/rean
#     (only required for forecast/hindcast entries)
#   - cds_params / http_params / opendap_params / s2sdb_params / subc_params:
#     provider-specific config (no secrets; credentials live in ~/.cdsapirc or
#     env vars)
#
# HOW TO ADD A NEW VARIABLE TO AN EXISTING SOURCE
# ------------------------------------------------
# 1. Find the dataset entry below (e.g. cds_ecmwf_seasonal).
# 2. Add the variable ID to the top-level "variables" list.
# 3. Inside the provider-specific params block (e.g. cds_params.variables),
#    add a sub-key for the new variable with at minimum:
#      nc_var, units_in, units_out, aggregation
#    Plus any provider-specific keys (e.g. "hindcast" CDS API name for CDS,
#    "has_daily" for NMME HTTP).
# 4. If this is a forecast dataset, update valid_pairs to list which obs/rean
#    datasets can be paired with this variable.
#
# HOW TO ADD AN ENTIRELY NEW SOURCE
# ----------------------------------
# 1. Choose a unique dataset_id (e.g. cds_newmodel_seasonal).
# 2. Create a new top-level entry under the appropriate category section.
# 3. Set provider, timescales, file_type, variables, clim_years.
# 4. Add the provider-specific params block with variable definitions.
# 5. For forecast/hindcast entries, define valid_pairs.
# 6. If the provider is new (not yet in VALID_PROVIDERS in loader.py),
#    you must also implement a provider class in src/cptdm/providers/.
#
# =============================================================================

schema_version: "0.1"

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  available_years syntax (v0.7.0)                                        ║
# ╠═══════════════════════════════════════════════════════════════════════════╣
# ║  [1981, 2016]          → fixed range (legacy, backward-compatible)      ║
# ║  [1981, ":"]           → open-ended: 1981 to present year              ║
# ║  ["1993:2016", "2021:"]→ multi-range with gap: 1993-2016 + 2021-now    ║
# ║                                                                         ║
# ║  --clim spanning a gap silently skips unavailable years.                ║
# ║  Example: --clim 1993-2025 on a model with hindcasts 1993-2016 and     ║
# ║  forecasts 2021-present will use 1993-2016 + 2021-2025 (24 years).     ║
# ╚═══════════════════════════════════════════════════════════════════════════╝


# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  SEASONAL FORECASTS — CDS (Copernicus Climate Data Store)               ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

cds_ecmwf_seasonal:
  label: "ECMWF SEAS5 (CDS)"
  short_label: "ecmwf"
  provider: cds
  timescales: [seasonal]
  file_type: forecast   # also produces hindcast; handled by orchestrator
  variables: [prcp, tmax, tmin, tmean, rfreq]
  clim_years: [1993, 2016]   # C3S default base period
  available_years: [1981, ":"]
  # rfreq available via seasonal-original-single-levels (daily) from all C3S models.
  valid_pairs:
    prcp: [chirps3, cru409]
    rfreq: [chirps3, cru409]
    tmax: [era5land, cru409]
    tmin: [era5land, cru409]
    tmean: [era5land, cru409]
  cds_params:
    dataset_hindcast: "seasonal-monthly-single-levels"
    originating_centre: "ecmwf"
    system: "51"
    variables:
      prcp:
        hindcast: "total_precipitation"
        nc_var: "tprate"
        units_in: "m/s"          # rate; converted to mm/month in pipeline
        units_out: "mm"
        aggregation: total
      tmax:
        hindcast: "maximum_2m_temperature_in_the_last_24_hours"
        nc_var: "mx2t24"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
      tmin:
        hindcast: "minimum_2m_temperature_in_the_last_24_hours"
        nc_var: "mn2t24"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
      tmean:
        hindcast: "2m_temperature"
        nc_var: "t2m"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
      rfreq:
        # Rainfall frequency: count days with tp > wet_day_threshold (default 1 mm/day).
        # Uses seasonal-original-single-levels (daily). Available from all C3S models.
        hindcast: "total_precipitation"
        forecast: "total_precipitation"
        nc_var: "tp"
        dataset_daily: "seasonal-original-single-levels"
        units_in: "m/day"
        units_out: "days"
        aggregation: rfreq
    product_type_hindcast: "monthly_mean"

