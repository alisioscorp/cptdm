# =============================================================================
# CPT-DM Dataset Registry  (datasets.yml)
# Version: 0.1.0
# =============================================================================
# This file defines every data source CPT-DM knows about.
# Users and administrators can extend or modify entries here without
# recompiling the binary.
#
# Schema rules (validated at startup by registry/loader.py):
#   - Each top-level key is a dataset_id (used in --dataset flag).
#   - provider: one of [cds, http, opendap, thredds, s2sdb, subc, http_index]
#   - timescales: list of [seasonal, intraseasonal]
#   - file_type: one of [forecast, hindcast, obs, reanalysis, index]
#   - variables: list of variable IDs this dataset provides
#   - clim_years: default climatology period [start, end]; null = use all years
#   - valid_pairs: datasets that can be paired with this one as obs/rean
#     (only required for forecast/hindcast entries)
#   - cds_params / http_params / opendap_params: provider-specific config
#     (no secrets; credentials live in ~/.cdsapirc or env vars)
# =============================================================================

schema_version: "0.1"

# ---------------------------------------------------------------------------
# FORECAST / HINDCAST  –  CDS (Copernicus Climate Data Store)
# ---------------------------------------------------------------------------

cds_ecmwf_seasonal:
  label: "ECMWF SEAS5 (CDS)"
  short_label: "ecmwf"
  provider: cds
  timescales: [seasonal]
  file_type: forecast   # also produces hindcast; handled by orchestrator
  variables: [prcp, tmax, tmin, tmean, rfreq]
  clim_years: [1993, 2016]   # SEAS5 hindcast period
  # rfreq available via seasonal-original-single-levels (daily). ECMWF SEAS5 only.
  valid_pairs:
    prcp: [chirps3, cru409]
    rfreq: [chirps3, cru409]
    tmax: [era5land, cru409]
    tmin: [era5land, cru409]
    tmean: [era5land, cru409]
  cds_params:
    dataset_hindcast: "seasonal-monthly-single-levels"
    originating_centre: "ecmwf"
    system: "51"
    variables:
      prcp:
        hindcast: "total_precipitation"
        nc_var: "tprate"
        units_in: "m/s"          # rate; converted to mm/month in pipeline
        units_out: "mm"
        aggregation: total
      tmax:
        hindcast: "maximum_2m_temperature_in_the_last_24_hours"
        nc_var: "mx2t24"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
      tmin:
        hindcast: "minimum_2m_temperature_in_the_last_24_hours"
        nc_var: "mn2t24"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
      tmean:
        hindcast: "2m_temperature"
        nc_var: "t2m"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
      rfreq:
        # Rainfall frequency: count days with tp > wet_day_threshold (default 1 mm/day).
        # Uses seasonal-original-single-levels (daily). ECMWF SEAS5 ONLY.
        # Other CDS models do not provide daily data — rfreq not available for them.
        hindcast: "total_precipitation"
        forecast: "total_precipitation"
        nc_var: "tp"
        dataset_daily: "seasonal-original-single-levels"
        units_in: "m/day"
        units_out: "days"
        aggregation: rfreq
    product_type_hindcast: "monthly_mean"

