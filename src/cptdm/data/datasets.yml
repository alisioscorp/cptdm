# ---------------------------------------------------------------------------
# FORECAST / HINDCAST  –  NMME (via NOAA FTP/HTTPS mirror)
# Note: IRIDL is defunct. NMME data accessed via ftp.cpc.ncep.noaa.gov.
# Daily data availability varies by model; RFREQ only where daily available.
# ---------------------------------------------------------------------------

nmme_cfsv2:
  label: "NMME CFSv2 (NOAA FTP)"
  short_label: "CFSv2"
  provider: http
  timescales: [seasonal]
  file_type: forecast
  variables: [prcp, tmean, rfreq]
  clim_years: [1982, 2010]
  valid_pairs:
    prcp: [chirps3, cru409]
    rfreq: [chirps3, cru409]
    tmean: [era5land, cru409]
  http_params:
    base_url: "https://ftp.cpc.ncep.noaa.gov/NMME"
    hindcast_path: "/clim/{model}/{variable}/"
    realtime_path: "/realtime_anom/{model}/{variable}/"
    file_pattern_hindcast: "{model}.{variable}.{YYYYMM}.nc"
    file_pattern_forecast: "{model}.{variable}.{YYYYMM}.nc"
    model_id: "CFSv2"
    variables:
      prcp:
        nc_var: "prec"
        units_in: "mm/day"
        units_out: "mm"
        aggregation: total
        has_daily: true      # CFSv2 has daily → RFREQ computable
      tmean:
        nc_var: "tref"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
        has_daily: false

nmme_cansipsv2:
  label: "NMME CanSIPSv2 (NOAA FTP)"
  short_label: "CanSIPSv2"
  provider: http
  timescales: [seasonal]
  file_type: forecast
  variables: [prcp, tmean]
  clim_years: [1981, 2010]
  valid_pairs:
    prcp: [chirps3, cru409]
    rfreq: [chirps3, cru409]
    tmean: [era5land, cru409]
  http_params:
    base_url: "https://ftp.cpc.ncep.noaa.gov/NMME"
    hindcast_path: "/clim/{model}/{variable}/"
    realtime_path: "/realtime_anom/{model}/{variable}/"
    file_pattern_hindcast: "{model}.{variable}.{YYYYMM}.nc"
    file_pattern_forecast: "{model}.{variable}.{YYYYMM}.nc"
    model_id: "CanCM4i"
    variables:
      prcp:
        nc_var: "prec"
        units_in: "mm/day"
        units_out: "mm"
        aggregation: total
        has_daily: false
      tmean:
        nc_var: "tref"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
        has_daily: false

nmme_gem52_nemo:
  label: "NMME GEM5.2-NEMO (NOAA FTP)"
  short_label: "GEM5.2-NEMO"
  provider: http
  timescales: [seasonal]
  file_type: forecast
  variables: [prcp, tmean]
  clim_years: [1993, 2020]
  hindcast_only: true
  # ⚠ GEM5.2-NEMO AVAILABILITY NOTE (for documentation):
  #   Climatology files are only available on the NOAA CPC FTP for
  #   initialisation months 05 (May), 06 (June), and 07 (July).
  #   Selecting this model with any other init month will fail at download.
  #   Realtime anomaly forecasts are not posted for this model.
  #   This limitation is upstream (NOAA FTP) and cannot be resolved in CPT-DM.
  valid_pairs:
    prcp: [chirps3, cru409]
    rfreq: [chirps3, cru409]
    tmean: [era5land, cru409]
  http_params:
    base_url: "https://ftp.cpc.ncep.noaa.gov/NMME"
    hindcast_path: "/clim/{model}/{variable}/"
    realtime_path: "/realtime_anom/{model}/{variable}/"
    file_pattern_hindcast: "{model}.{variable}.{YYYYMM}.nc"
    file_pattern_forecast: "{model}.{variable}.{YYYYMM}.nc"
    model_id: "GEM5.2_NEMO"
    variables:
      prcp:
        nc_var: "prec"
        units_in: "mm/day"
        units_out: "mm"
        aggregation: total
        has_daily: false
      tmean:
        nc_var: "tref"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
        has_daily: false


# ---------------------------------------------------------------------------
# FORECAST / HINDCAST  –  S2S Database (intraseasonal, via ECMWF API)
# ---------------------------------------------------------------------------

s2sdb_ecmwf:
  label: "S2S ECMWF (S2S Database)"
  short_label: "ecmwf"
  provider: s2sdb
  timescales: [intraseasonal]
  file_type: forecast
  variables: [prcp, tmean]
  clim_years: [1999, 2019]   # standard S2SDB hindcast period for ECMWF
  valid_pairs:
    prcp: [chirps3]
    tmean: [era5land]
  s2sdb_params:
    model: "ecmwf"
    variables:
      prcp:
        parameter: "tp"      # total precipitation
        units_in: "m"
        units_out: "mm"
        aggregation: total
      tmean:
        parameter: "2t"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
    # Available weeks: 1, 2, 3, 4, 34 (combined weeks 3+4)
    available_leads: [week1, week2, week3, week4, week34]
    # Init dates available roughly twice-weekly for ECMWF
    init_frequency: "twice_weekly"

s2sdb_ncep:
  label: "S2S NCEP (S2S Database)"
  short_label: "ncep"
  provider: s2sdb
  timescales: [intraseasonal]
  file_type: forecast
  variables: [prcp, tmean]
  clim_years: [1999, 2010]
  valid_pairs:
    prcp: [chirps3]
    tmean: [era5land]
  s2sdb_params:
    model: "ncep"
    variables:
      prcp:
        parameter: "tp"
        units_in: "m"
        units_out: "mm"
        aggregation: total
      tmean:
        parameter: "2t"
        units_in: "K"
        units_out: "degree_Celsius"
        aggregation: mean
    available_leads: [week1, week2, week3, week4, week34]
    init_frequency: "weekly"

