# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  VALID PAIRING MATRIX  (reference; auto-derived from valid_pairs above) ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
# seasonal:
#   prcp forecasts: cds_ecmwf_seasonal, cds_ncep_seasonal, cds_eccc_seasonal,
#                   nmme_cfsv2, nmme_cansipsv2, + all other CDS/NMME models
#   prcp obs:       chirps3, cru409
#   temp forecasts: cds_ecmwf_seasonal, cds_ncep_seasonal, cds_eccc_seasonal,
#                   nmme_cfsv2 (tmean only), nmme_cansipsv2 (tmean only), + others
#   temp rean:      era5land, cru409
#   sst:            ersst5 (paired with any seasonal predictand)
#   enso:           roni   (paired with any seasonal predictand)
#
# intraseasonal:
#   prcp forecasts: s2sdb_ecmwf, s2sdb_ncep, subc_emean, subc_emax, subc_emin
#   prcp obs:       chirps3
#   temp forecasts: s2sdb_ecmwf, s2sdb_ncep, subc_emean, subc_emax, subc_emin
#   temp rean:      era5land
